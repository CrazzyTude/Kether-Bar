       # wsl:
       #   enabled: true
       #   prefix: "wsl"
       #   priority: 23
       #   show_online: true
      popup:
        width: 720
        height: 420
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "none"
        dark_mode: true
      animation:
        enabled: true
        type: "fadeInOut"
        duration: 200
      callbacks:
        on_left: "toggle_quick_launch"
      keybindings:
        - keys: "alt+space"
          action: "toggle_quick_launch"
