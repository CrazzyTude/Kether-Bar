       # unit_converter:
       #   enabled: true
       #   prefix: "~"
       #   priority: 17
       # vscode:
       #   enabled: true
       #   prefix: "vsc"
       #   priority: 18
        web_search:
          enabled: true
          prefix: "?"
          priority: 4
          engine: "google"
       # window_switcher:
       #   enabled: true
       #   prefix: "win"
